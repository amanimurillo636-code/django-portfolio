{% extends "portfolio_app/base_template.html" %}

{% block content %}

<h2>Active Student Portfolios</h2>

<ul>
    <!-- for loop-->
    {% for portfolio in active_portfolios %}
   <!-- Displays the value of a template variable --> 
        <li>{{ portfolio.title }}</li>
    {% empty %}
        <li>No active portfolios found.</li>
    {% endfor %}
</ul>

{% endblock %}
